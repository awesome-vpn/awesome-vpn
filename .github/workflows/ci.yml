name: CI Quality Gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint: # ruff lint + format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install deps (uv)
        run: uv sync --group dev
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck: # mypy static type analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --group dev
      - name: mypy
        run: uv run mypy core main.py --ignore-missing-imports --explicit-package-bases
        continue-on-error: true # Non-blocking advisory during transition

  test: # pytest + coverage + xdist parallel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: uv sync --group dev
      - name: Run tests with coverage
        run: |
          uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=25 -n auto -q
      - name: Upload coverage to Codecov (best-effort)
        if: matrix.python-version == '3.11'
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload htmlcov artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: htmlcov-${{ matrix.python-version }}
          path: htmlcov
          retention-days: 7

  security: # bandit + pip-audit security scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --group dev
      - name: Bandit (SAST)
        run: uv run bandit -c pyproject.toml -r core main.py
      - name: pip-audit (SCA)
        run: uv run pip-audit --desc --local || true
        continue-on-error: true
