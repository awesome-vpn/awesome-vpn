name: CI Quality Gate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint: # ruff lint + format — 零容忍，自动可修复的会推回由 autofix 作业处理
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  typecheck: # mypy 渐进式类型检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: mypy
        run: mypy core main.py --ignore-missing-imports --explicit-package-bases
        continue-on-error: true # 过渡期不阻断，成熟后改为 false

  test: # pytest + coverage + xdist 并行 + codecov
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=25 -n auto -q
      - name: Upload coverage to Codecov (best-effort)
        if: matrix.python-version == '3.11'
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload htmlcov artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov-${{ matrix.python-version }}
          path: htmlcov
          retention-days: 7

  security: # bandit + pip-audit + gitleaks 轻量安全
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install bandit[toml] pip-audit
      - name: Bandit (SAST)
        run: bandit -c pyproject.toml -r core main.py
      - name: pip-audit (SCA)
        run: pip-audit --desc --local || true # 私有源 404 不阻断，发 warn 即可
        continue-on-error: true
