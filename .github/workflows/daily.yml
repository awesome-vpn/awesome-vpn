name: Daily Crawler

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: daily-crawler
  cancel-in-progress: false

env:
  SING_BOX_VERSION: "1.13.3"
  MAX_NODES: "50"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Dependencies (uv)
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -q

      - name: Lint (ruff check, non-blocking)
        continue-on-error: true
        run: uv run ruff check . || true

  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: test
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        python-version: "3.11"

    - name: Cache sing-box binary
      uses: actions/cache@v6
      with:
        path: bin/
        key: sing-box-${{ runner.os }}-${{ runner.arch }}-${{ env.SING_BOX_VERSION }}

    - name: Get current month (for MMDB cache key)
      id: date
      run: echo "month=$(date +'%Y-%m')" >> $GITHUB_OUTPUT

    - name: Cache GeoLite2-City MMDB
      id: mmdb-cache
      uses: actions/cache@v6
      with:
        path: config/GeoLite2-City.mmdb
        key: geolite2-mmdb-${{ steps.date.outputs.month }}
        restore-keys: geolite2-mmdb-

    - name: Install Dependencies (uv)
      run: uv sync

    - name: Download GeoLite2-City MMDB
      if: steps.mmdb-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p config
        curl -fSL --max-time 60 \
          "https://github.com/P3TERX/GeoLite.mmdb/raw/download/GeoLite2-City.mmdb" \
          -o config/GeoLite2-City.mmdb \
          && echo "MMDB downloaded ($(du -sh config/GeoLite2-City.mmdb | cut -f1))" \
          || echo "MMDB download failed — will use ipinfo.io fallback"

    - name: Ensure config directory exists
      run: mkdir -p config

    - name: Run Crawler
      id: crawler
      env:
        # 优先读取 Variables（可见），回退 Secrets（兼容旧配置）
        TELEGRAM_CHANNELS: ${{ vars.ACTIVE_TELEGRAM_CHANNELS || secrets.TELEGRAM_CHANNELS }}
        EXTRA_URLS: ${{ secrets.EXTRA_URLS }}
        SOURCES_JSON: ${{ vars.ACTIVE_GITHUB_URLS || secrets.SOURCES_JSON }}
        SING_BOX_VERSION: ${{ env.SING_BOX_VERSION }}
        MAX_NODES: "50"
        # 可选：大陆侧探活（自建杭州/深圳探针POST {server,port} → {ok:bool}）
        CHINA_CHECK_URL: ${{ secrets.CHINA_CHECK_URL }}
      run: |
        uv run python main.py --validate --workers 30 --validate-workers 50 --output .

    - name: Verify Outputs
      id: verify
      run: |
        [ -s all ] || (echo "ERROR: all is empty" && exit 1)
        [ -s sing-box.json ] || (echo "ERROR: sing-box.json is empty" && exit 1)
        [ -s clash.yaml ] || (echo "ERROR: clash.yaml is empty" && exit 1)
        [ -x bin/sing-box-linux-amd64 ] || (echo "ERROR: sing-box binary is missing" && exit 1)
        bin/sing-box-linux-amd64 check -c sing-box.json
        uv run python -c "import json,collections; tags=[n['tag'] for n in json.load(open('sing-box.json'))['outbounds']]; assert len(tags)==len(set(tags)), f'duplicate tags found: {len(tags)-len(set(tags))}'"
        echo "Output sizes:"
        ls -lh all sing-box.json clash.yaml
        # 统计有效节点（排除策略组，按 type 而非 tag，改名免疫）
        NODE_COUNT=$(uv run python -c 'import json; d=json.load(open("sing-box.json")); print(len([n for n in d["outbounds"] if n.get("type") not in ("urltest","selector","direct")]))')
        echo "node_count=$NODE_COUNT" >> $GITHUB_OUTPUT
        echo "Node count: $NODE_COUNT (target MAX_NODES=${{ env.MAX_NODES }})"
        if [ "$NODE_COUNT" -lt 10 ]; then
          echo "::warning::node count suspiciously low ($NODE_COUNT)"
        fi
        if [ "$NODE_COUNT" -gt 50 ]; then
          echo "::warning::node count exceeds MAX_NODES (strict 50, got $NODE_COUNT)"
        fi
        # 大陆友好度抽检：统计 REALITY/WS+TLS 占比（排除策略组）
        uv run python -c "import json; d=json.load(open('sing-box.json')); nodes=[n for n in d['outbounds'] if n.get('type') not in ('urltest','selector','direct')]; total=len(nodes); reality=sum(1 for n in nodes if n.get('tls',{}).get('reality',{}).get('enabled')); ws=sum(1 for n in nodes if (n.get('transport') or {}).get('type')=='ws'); print(f'Quality: REALITY {reality}/{total} ({reality*100//total if total else 0}%), WS {ws}/{total}')"

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: crawler-outputs
        path: |
          all
          sing-box.json
          clash.yaml
        retention-days: 7
        if-no-files-found: error

    - name: Commit and Push
      if: steps.verify.outputs.node_count != '0'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add all sing-box.json clash.yaml
        NODE_COUNT=$(uv run python -c 'import json; d=json.load(open("sing-box.json")); print(len([n for n in d["outbounds"] if n.get("type") not in ("urltest","selector","direct")]))')
        git diff --staged --quiet || \
          git commit -m "update: $(date +'%Y-%m-%d') - ${NODE_COUNT} nodes"
        git push
