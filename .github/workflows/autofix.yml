name: Autofix

# Automated fix workflow: auto-fixes and commits format/lint issues on PR
# Mirrors local pre-commit hooks for contributors who omitted local hook setup
on:
  pull_request:
    branches: [master, main]

permissions:
  contents: write
  pull-requests: write

jobs:
  ruff-autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --group dev
      - name: Ruff fix
        run: |
          uv run ruff check --fix . || true
          uv run ruff format . || true
      - name: Push fixes if any
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore(autofix): ruff fix + format"
            git push
          else
            echo "No autofix needed"
          fi
