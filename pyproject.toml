[project]
name = "awesome-vpn"
version = "0.1.0"
description = "Free proxy nodes, updated daily. Zero config, copy and use."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
keywords = ["vpn", "proxy", "sing-box", "clash", "v2ray"]
dependencies = [
    "requests[socks]>=2.32.0",
    "PyYAML>=6.0.1",
    "beautifulsoup4>=4.12.0",
    "chardet>=5.2.0",
    "cryptography>=42.0.0",
    "paramiko>=3.4.0",
    "scp>=0.15.0",
    "geoip2>=4.7.0",
    "maxminddb>=2.2.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.6.0",
    "hypothesis>=6.100.0",
    "coverage[toml]>=7.6.0",
    "ruff>=0.8.0",
    "mypy>=1.10.0",
    "types-requests>=2.32.0",
    "types-PyYAML>=6.0",
    "types-beautifulsoup4>=4.12.0",
    "bandit[toml]>=1.7.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    "deptry>=0.18.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

# ========== Ruff: lint + format (替代 flake8/isort/black) ==========
[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["bin", "config", ".git", "__pycache__", ".ruff_cache", ".mypy_cache", "docs"]

[tool.ruff.lint]
# 主流精简版：E/W/F 语法+风格, I isort, UP 升级, B bugbear, S bandit
# C4/SIM/RUF 轻量但对存量代码噪音大，暂不启用；N/A/C90 过于严苛
select = ["E", "F", "W", "I", "UP", "B", "S"]
ignore = [
    "E501",  # line length handled by formatter
    "S101",  # assert in tests is OK
    "S603",  # subprocess without shell is OK (sing-box)
    "S607",  # partial executable path OK
    "E402",  # import not at top (main.py 需 sys.path hack)
    "E721",  # type(x) == y vs isinstance (legacy parsers)
    "S103",  # os.chmod 0o755 for sing-box binary is intended
    "S104",  # bind 0.0.0.0 in FAKE_IPS list is data, not binding
    "S105",  # hardcoded password in tests/parsers is test data
    "S110",  # try-except-pass in parsers is intentional fallback
    "S112",  # try-except-continue in validator
    "S311",  # random for name generation, not crypto
    "B007",  # unused loop variable in parsers
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S603", "S607"]
"core/parsers/*.py" = ["S101", "S110", "S112", "E402", "F821", "C901"]  # legacy parsers
"core/binary_manager.py" = ["S310", "S603", "S607", "S104", "S105", "C901"]
"core/validator.py" = ["S310", "S603", "S607", "S104", "C901"]
"core/geo_utils.py" = ["S110", "S112"]
"core/parsers/tool.py" = ["E402", "F821", "C901", "C402", "C403", "C416"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ========== Pytest + Coverage ==========
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["core", "main"]
omit = ["tests/*", "*/__pycache__/*", "core/parsers/tool.py"]  # tool.py legacy regex pool excluded initially
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
skip_covered = false
show_missing = true
fail_under = 25  # 当前 27% 起步，已覆盖核心转换/去重，随新增测试逐步收紧 60%→80%
precision = 2

[tool.coverage.html]
directory = "htmlcov"

# ========== Mypy: 类型检查 ==========
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
ignore_missing_imports = true
# 渐进式严格：先不强制，后续逐步收紧
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_reexport = true
show_error_codes = true
explicit_package_bases = true
mypy_path = "."
exclude = "core/parsers"  # legacy parsers 用相对导入，单独排除避免 No parent module

[[tool.mypy.overrides]]
module = ["core.parsers.*", "core.parsers.tool"]
ignore_errors = true  # legacy parsers 暂不检查，重点保障 core/ 主路径

# ========== Bandit: 安全扫描 ==========
[tool.bandit]
exclude_dirs = ["tests", "bin", "config", ".git", "__pycache__"]
skips = ["B101", "B601", "B110", "B112", "B105", "B106", "B311", "B104", "B404", "B603"]  # B104 0.0.0.0 (sing-box 127.0.0.1 误报), B404/B603 subprocess sing-box 预期

# ========== Deptry: 依赖健康检查 ==========
[tool.deptry]
# 可选：pip install deptry 后运行 deptry . 检测缺失/冗余依赖
