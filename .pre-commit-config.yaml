# Automated pre-commit hooks configuration
# Local: auto-fixes on commit after `pre-commit install`
# CI: verified in .github/workflows/ci.yml
# Manual: `pre-commit run --all-files` or `make fix`
repos:
  # 1. Basic file hygiene (pre-commit-hooks)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-ast
      - id: pretty-format-json
        args: [--autofix, --top-keys=outbounds]
        exclude: ^sing-box\.json$

  # 2. Ruff: lint auto-fix + formatting (replaces black/isort/flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types: [python]
      - id: ruff-format
        types: [python]

  # 3. Deptry: dependency health
  # - repo: https://github.com/fpgmaas/deptry
  #   rev: 0.18.0
  #   hooks:
  #     - id: deptry
  #       args: [--verbose]
  #       pass_filenames: false

  # 4. Bandit: security scan (scans core/ and main.py using pyproject.toml skips)
  - repo: https://github.com/pycqa/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "core", "main.py"]
        exclude: ^tests/

  # 5. Mypy: type check
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.11.2
  #   hooks:
  #     - id: mypy
  #       args: [--ignore-missing-imports]
  #       additional_dependencies: [types-requests, types-PyYAML, types-beautifulsoup4]
  #       pass_filenames: false

ci:
  autofix_commit_msg: "chore(pre-commit): autofix"
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "chore(pre-commit): autoupdate"
  skip: []  # Do not skip hooks
