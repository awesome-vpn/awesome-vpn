# 顶级预提交自动纠错 — 本地: pre-commit install 后每次 commit 自动修复
# CI  : 同步在 .github/workflows/ci.yml 中强制校验（fail-fast）
# 手动: pre-commit run --all-files  或  make fix
repos:
  # 1. 基础文件卫生 (pre-commit-hooks) — 最主流、零误报
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-ast
      - id: pretty-format-json
        args: [--autofix, --top-keys=outbounds]
        exclude: ^sing-box\.json$

  # 2. Ruff: lint 自动修复 + format (替代 black/isort/flake8 三件套)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types: [python]
      - id: ruff-format
        types: [python]

  # 3. Deptry: 依赖健康 (轻量, 仅提示不阻断)
  # - repo: https://github.com/fpgmaas/deptry
  #   rev: 0.18.0
  #   hooks:
  #     - id: deptry
  #       args: [--verbose]
  #       pass_filenames: false

  # 4. Bandit: 安全扫描 (仅扫描 core/main, 采用 pyproject.toml 的 skips)
  - repo: https://github.com/pycqa/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "core", "main.py"]
        exclude: ^tests/

  # 5. Mypy: 类型检查 (仅提示, 渐进式严格化)
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.11.2
  #   hooks:
  #     - id: mypy
  #       args: [--ignore-missing-imports]
  #       additional_dependencies: [types-requests, types-PyYAML, types-beautifulsoup4]
  #       pass_filenames: false

ci:
  autofix_commit_msg: "chore(pre-commit): autofix"
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "chore(pre-commit): autoupdate"
  skip: []  # 不跳过任何 hook
